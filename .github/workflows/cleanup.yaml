name: "Clean up deployment"
on:
  pull_request:
    branches:
      - main
    types: closed
    paths-ignore:
      - '**/README.md'
      - 'kustomize/**'
      - '.github/workflows/kustomize-build-ci.yaml'
      - 'terraform/**'
      - '.github/workflows/terraform-validate-ci.yaml'
jobs:
  # Disabled: was used for deleting PR namespaces on Google internal staging cluster
  cleanup-namespace:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cleanup of Google staging cluster disabled in fork"
